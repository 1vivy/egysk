name: Clippy check

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/clippy.yml'
      - 'magisk/**'
      - 'modules/**'
      - 'tools/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/clippy.yml'
      - 'magisk/**'
      - 'modules/**'
      - 'tools/**'

env:
  RUSTFLAGS: '-Dwarnings'

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: rustup update stable
      
      - uses: Swatinem/rust-cache@v2

      - name: Bootstrap hash-pinned ONDK
        run: python3 tools/bootstrap_ondk.py

      - name: Run clippy
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/out/toolchains/ondk-r30.1
        run: |
          export CARGO_TARGET_DIR=out/clippy
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          source .github/scripts/setup-rust-build.sh x86_64-linux-android 26
          cargo clippy --target aarch64-linux-android --release
          cargo clippy --target x86_64-linux-android --release
