name: Build Magisk-derived Egysk userspace
on:
  workflow_call:
    inputs:
      abi:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Keep r29 only for --static-ndk. ONDK r30.1's static libc.a embeds a Rust
      # std (librustlibs), so linking egyskinit fails: duplicate symbol
      # rust_eh_personality. See README's CI toolchain contract.
      - uses: nttld/setup-ndk@v1
        id: static-ndk
        with:
          ndk-version: r29
      - name: Bootstrap hash-pinned ONDK
        run: python3 tools/bootstrap_ondk.py
      - name: Materialize exact product patches
        run: python3 magisk/scripts/magisk.py materialize --init-dependencies
      - name: Build native initializer, daemon and policy tool
        run: python3 magisk/scripts/magisk.py build --ndk out/toolchains/ondk-r30.1 --static-ndk '${{ steps.static-ndk.outputs.ndk-path }}' --abi '${{ inputs.abi }}'
      - name: Check source materialization remains exact
        run: python3 magisk/scripts/magisk.py materialize --check
      - uses: actions/upload-artifact@v7
        with:
          name: egysk-native-${{ inputs.abi }}
          path: out/native/${{ inputs.abi }}/bin/
          if-no-files-found: error
